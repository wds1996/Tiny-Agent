[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent-runtime"
version = "0.1.0"
description = "A learning-first, production-minded agent runtime built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2,<3"]
stage03 = [
    "langgraph>=1.2,<2",
    "langchain>=1.3,<2",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
