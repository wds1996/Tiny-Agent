[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent-runtime"
version = "0.2.0"
description = "A mechanism-first, production-minded learning path for modern AI Agent systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2,<3"]
stage03 = ["langgraph>=1.2,<2"]
stage04 = ["numpy>=1.26", "faiss-cpu>=1.9,<2", "qdrant-client>=1.14,<2", "langchain>=1.3,<2"]
stage05 = ["mcp[cli]>=2,<3"]
stage06 = ["langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "langgraph-checkpoint-postgres>=3.1,<4", "psycopg[binary,pool]>=3.3,<4"]
stage08 = ["pyyaml>=6,<7"]
stage09 = ["jsonschema>=4.25,<5", "tenacity>=9,<10", "pydantic>=2.11,<3"]
stage10 = ["langsmith>=0.11,<1", "opentelemetry-api>=1.42,<2", "opentelemetry-sdk>=1.42,<2"]
stage11 = ["openai-agents>=0.22,<1", "a2a-sdk>=1.1,<2"]
stage13 = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "pydantic-settings>=2.15,<3",
    "redis>=8.1,<9",
    "psycopg[binary,pool]>=3.3,<4",
    "httpx2>=2.12,<3",
    "a2a-sdk[http-server]>=1.1,<2",
]
stage15 = [
    "openai>=2,<3",
    "langgraph>=1.2,<2",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "httpx2>=2.12,<3",
    "pypdf>=6.16,<7",
    "mcp[cli]>=2,<3",
    "a2a-sdk[http-server]>=1.1,<2",
    "qdrant-client>=1.14,<2",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
