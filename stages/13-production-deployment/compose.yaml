services:
  api:
    build:
      context: ../..
      dockerfile: stages/13-production-deployment/Dockerfile
    environment:
      TINY_AGENT_ENVIRONMENT: dev
      TINY_AGENT_REDIS_URL: redis://redis:6379/0
      TINY_AGENT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      TINY_AGENT_MAX_CONCURRENCY: "4"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
