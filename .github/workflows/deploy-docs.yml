name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "assets/**"
      - "stages/**"
      - "mkdocs.yml"
      - "scripts/prepare_docs.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation builder
        run: python -m pip install --upgrade mkdocs-material
      - name: Build documentation source
        run: python scripts/prepare_docs.py
      - name: Build static site
        run: mkdocs build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-deployments:
    name: Keep the latest Pages deployment
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      deployments: write
    steps:
      - name: Delete older Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: "github-pages",
              per_page: 100,
            });

            deployments.sort(
              (left, right) => new Date(right.created_at) - new Date(left.created_at),
            );

            const [latest, ...older] = deployments;
            if (!latest) {
              core.info("No github-pages deployments to clean up.");
              return;
            }

            for (const deployment of older) {
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              });
            }

            core.info(
              `Kept deployment ${latest.id}; deleted ${older.length} older deployment(s).`,
            );
