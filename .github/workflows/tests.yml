name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core tests
        run: |
          pytest -q \
            --ignore=tests/test_langgraph_runtime.py \
            --ignore=tests/test_stage03_frameworks.py \
            --ignore=tests/test_stage04_vector_backends.py \
            --ignore=tests/test_stage05_mcp.py

  stage03-framework-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Stage 03 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,stage03]"

      - name: Run Stage 03 framework tests
        run: |
          pytest -q \
            tests/test_langgraph_runtime.py \
            tests/test_stage03_frameworks.py

  stage04-vector-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Stage 04 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,stage04]"

      - name: Run Stage 04 vector backend tests
        run: |
          pytest -q tests/test_stage04_vector_backends.py

  stage05-mcp-pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Stage 05 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,stage05]"

      - name: Run Stage 05 MCP tests
        run: |
          pytest -q tests/test_stage05_mcp.py

      - name: Smoke-test Stage 05 runnable examples
        run: |
          python stages/05-mcp/code/protocol_message_walkthrough.py
          python stages/05-mcp/code/in_memory_client.py
          python stages/05-mcp/code/stdio_client.py
          python stages/05-mcp/code/tiny_agent_mcp_bridge.py

      - name: Smoke-test Stage 05 Streamable HTTP example
        run: |
          python stages/05-mcp/code/streamable_http_server.py > /tmp/tiny-agent-mcp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=0.5):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Streamable HTTP MCP server did not start")
          PY

          python stages/05-mcp/code/streamable_http_client.py

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
