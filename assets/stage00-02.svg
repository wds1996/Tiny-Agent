<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect width="1448" height="1086" fill="#fdfdfd"/>
  <style>
    .title{font:700 54px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#081a3b}
    .subtitle{font:600 36px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#56637d}
    .h{font:700 24px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#081a3b}
    .b{font:500 20px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#526079}
    .small{font:500 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#66748d}
  </style>
  <text x="724" y="68" text-anchor="middle" class="title">Tool Calling：从请求到 Observation</text>
  <text x="724" y="130" text-anchor="middle" class="subtitle">Stage 00：理解 model → tool → model 的最小闭环</text>
  <rect x="488" y="179" width="516" height="48" rx="10" fill="#fff8ef" stroke="#ff8b16" stroke-width="2"/>
  <text x="746" y="211" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#c65b00">call_id：关联某次 Tool Call 与对应 Tool Output</text>
  <path d="M488 203H356V250M1004 203H1054V250" fill="none" stroke="#ff8b16" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="356" cy="250" r="7" fill="#ff8b16"/><circle cx="1054" cy="250" r="7" fill="#ff8b16"/>
  <g stroke-width="2">
    <rect x="17" y="258" width="198" height="356" rx="13" fill="#eef7ff" stroke="#2692ef"/>
    <rect x="237" y="258" width="226" height="356" rx="13" fill="#f2fcf5" stroke="#20a05a"/>
    <rect x="484" y="258" width="210" height="356" rx="13" fill="#eef7ff" stroke="#2692ef"/>
    <rect x="714" y="258" width="210" height="356" rx="13" fill="#eef7ff" stroke="#2692ef"/>
    <rect x="945" y="258" width="225" height="356" rx="13" fill="#fffaf1" stroke="#ff8b16"/>
    <rect x="1191" y="258" width="201" height="356" rx="13" fill="#f2fcf5" stroke="#20a05a"/>
  </g>
  <g stroke="#1472c9" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M215 405H232"/><path d="M225 395l11 10-11 10"/>
    <path d="M463 405H479"/><path d="M472 395l11 10-11 10"/>
    <path d="M694 405H709"/><path d="M702 395l11 10-11 10"/>
    <path d="M924 405H940"/><path d="M933 395l11 10-11 10"/>
    <path d="M1170 405H1186"/><path d="M1179 395l11 10-11 10"/>
  </g>
  <circle cx="115" cy="309" r="29" fill="#1467c9"/>
  <circle cx="115" cy="298" r="10" fill="#fff"/><path d="M94 329c6-18 36-18 42 0" fill="#fff"/>
  <text x="116" y="391" text-anchor="middle" class="h">1. 用户提出任务</text>
  <rect x="29" y="443" width="174" height="150" rx="11" fill="#f8fbff" stroke="#c6dff8"/>
  <text x="49" y="485" class="b">例如：读取</text><text x="49" y="520" class="b">Tokyo 的教学</text><text x="49" y="555" class="b">天气记录</text>
  <circle cx="350" cy="309" r="29" fill="#148b6b"/><text x="350" y="318" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">M</text>
  <text x="350" y="382" text-anchor="middle" class="h">2. 模型返回</text><text x="350" y="414" text-anchor="middle" class="h">Function Call</text>
  <rect x="252" y="444" width="196" height="150" rx="11" fill="#f8fff9" stroke="#caead5"/>
  <text x="266" y="480" class="b">提出调用请求，</text><text x="266" y="513" class="b">而不是已经执行</text><text x="266" y="549" class="small">get_teaching_weather</text><text x="266" y="575" class="small">(city=&quot;Tokyo&quot;)</text>
  <circle cx="589" cy="309" r="29" fill="#236cc4"/><text x="589" y="318" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">✓</text>
  <text x="589" y="391" text-anchor="middle" class="h">3. 应用检查调用</text>
  <rect x="500" y="443" width="178" height="150" rx="11" fill="#f8fbff" stroke="#c6dff8"/>
  <circle cx="518" cy="478" r="6" fill="#2384d8"/><text x="536" y="485" class="b">校验工具名</text><circle cx="518" cy="518" r="6" fill="#2384d8"/><text x="536" y="525" class="b">解析并验证参数</text><circle cx="518" cy="558" r="6" fill="#2384d8"/><text x="536" y="565" class="b">决定是否允许执行</text>
  <circle cx="819" cy="309" r="29" fill="#236cc4"/><text x="819" y="319" text-anchor="middle" font-family="monospace" font-size="21" font-weight="700" fill="#fff">&gt;_</text>
  <text x="819" y="382" text-anchor="middle" class="h">4. Python 执行</text><text x="819" y="414" text-anchor="middle" class="h">handler</text>
  <rect x="730" y="443" width="178" height="150" rx="11" fill="#f8fbff" stroke="#c6dff8"/>
  <text x="744" y="487" class="b">真正调用</text><text x="744" y="525" class="small">get_teaching_</text><text x="744" y="552" class="small">weather(city)</text>
  <circle cx="1057" cy="309" r="29" fill="#ed8b20"/><text x="1057" y="318" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">R</text>
  <text x="1057" y="391" text-anchor="middle" class="h">5. 返回 Tool Output</text>
  <rect x="961" y="443" width="193" height="150" rx="11" fill="#fffdf9" stroke="#f1d2a5"/>
  <text x="975" y="482" class="b">function_call_output</text><text x="975" y="518" class="b">携带真实结果作为</text><text x="975" y="553" class="b">Observation</text>
  <circle cx="1292" cy="309" r="29" fill="#148b6b"/><text x="1292" y="318" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">M</text>
  <text x="1292" y="382" text-anchor="middle" class="h">6. 第二次模型调用</text><text x="1292" y="414" text-anchor="middle" class="h">生成最终回答</text>
  <rect x="1207" y="443" width="168" height="150" rx="11" fill="#f8fff9" stroke="#caead5"/>
  <text x="1222" y="486" class="b">只根据返回的</text><text x="1222" y="522" class="b">工具结果作答</text>
  <path d="M356 625V669H1292V625" fill="none" stroke="#2588d8" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="356" cy="625" r="7" fill="#2588d8"/><circle cx="1292" cy="625" r="7" fill="#2588d8"/>
  <rect x="506" y="646" width="601" height="49" rx="10" fill="#f1f7ff" stroke="#2588d8" stroke-width="2"/>
  <text x="807" y="678" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#1558ad">previous_response_id：关联前后两次 Provider Response</text>
  <rect x="20" y="731" width="1368" height="168" rx="13" fill="#f8fbff" stroke="#64a7ef" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="185" y="833" class="h" font-size="30">为什么这张图重要</text><line x1="493" y1="762" x2="493" y2="870" stroke="#b7d3ee" stroke-width="2"/>
  <circle cx="552" cy="776" r="8" fill="#2384d8"/><text x="576" y="786" class="b">Function Call 只是请求，不代表动作成功</text><circle cx="552" cy="818" r="8" fill="#2384d8"/><text x="576" y="828" class="b">真正执行权在应用程序手里</text><circle cx="552" cy="860" r="8" fill="#2384d8"/><text x="576" y="870" class="b">模型看到 Tool Output 后，才能基于 Observation 回答</text>
  <rect x="20" y="931" width="1368" height="105" rx="13" fill="#fff8f8" stroke="#ff9999" stroke-width="2"/>
  <polygon points="77,953 107,1010 47,1010" fill="#e53636"/><text x="77" y="994" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">!</text>
  <text x="141" y="994" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#d42f2f">最关键的顺序：</text>
  <text x="364" y="994" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#13203b">模型提出 → 程序验证 → 程序执行 → 返回 Observation → 模型回答</text>
</svg>