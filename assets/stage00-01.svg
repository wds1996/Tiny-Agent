<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <rect width="1448" height="1086" fill="#fdfdfd"/>
  <style>
    .title{font:700 56px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#081a3b}
    .subtitle{font:600 36px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#56637d}
    .h{font:700 28px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#081a3b}
    .b{font:500 22px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#526079}
    .small{font:500 19px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#66748d}
    .white{fill:#fff}
  </style>
  <text x="724" y="70" text-anchor="middle" class="title">模型生成 ≠ 程序执行</text>
  <text x="724" y="132" text-anchor="middle" class="subtitle">Stage 00：先建立正确的权限边界心智模型</text>
  <g stroke-width="2">
    <rect x="24" y="188" width="278" height="168" rx="14" fill="#eef7ff" stroke="#2692ef"/>
    <rect x="349" y="188" width="325" height="168" rx="14" fill="#eef7ff" stroke="#2692ef"/>
    <rect x="721" y="188" width="305" height="168" rx="14" fill="#eefbf4" stroke="#20a05a"/>
    <rect x="1073" y="188" width="313" height="168" rx="14" fill="#eef7ff" stroke="#2692ef"/>
  </g>
  <circle cx="84" cy="242" r="18" fill="#1266c3"/>
  <path d="M55 289c6-28 52-28 58 0v8H55z" fill="#1266c3"/>
  <rect x="397" y="228" width="52" height="66" rx="8" fill="none" stroke="#1266c3" stroke-width="7"/>
  <line x1="408" y1="245" x2="438" y2="245" stroke="#1266c3" stroke-width="5"/>
  <line x1="408" y1="263" x2="438" y2="263" stroke="#1266c3" stroke-width="5"/>
  <line x1="408" y1="281" x2="430" y2="281" stroke="#1266c3" stroke-width="5"/>
  <circle cx="789" cy="259" r="38" fill="none" stroke="#128b72" stroke-width="8"/>
  <path d="M761 257h56M789 231v55" stroke="#128b72" stroke-width="8" stroke-linecap="round"/>
  <path d="M1118 261l-18 18 18 18M1160 261l18 18-18 18M1148 246l-20 66" stroke="#1266c3" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="145" y="265" class="h">用户输入</text>
  <text x="145" y="309" class="b">提出问题或需求</text>
  <text x="478" y="255" class="h">Python 程序</text>
  <text x="478" y="290" class="h">组织请求</text>
  <text x="435" y="329" class="b">将输入整理并发送给模型</text>
  <text x="844" y="255" class="h">模型服务</text>
  <text x="844" y="290" class="h">生成响应</text>
  <text x="828" y="329" class="b">理解输入并生成回复</text>
  <text x="1182" y="260" class="h">Python 读取响应</text>
  <text x="1182" y="302" class="b">解析结果并根据需要</text>
  <text x="1182" y="329" class="b">继续处理</text>
  <g stroke="#1472c9" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M302 272H343"/><path d="M332 262l11 10-11 10"/>
    <path d="M674 272H715"/><path d="M704 262l11 10-11 10"/>
    <path d="M1026 272H1067"/><path d="M1056 262l11 10-11 10"/>
  </g>
  <rect x="24" y="392" width="486" height="303" rx="14" fill="#f4fff8" stroke="#45b97c" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="529" y="392" width="510" height="303" rx="14" fill="#f5f9ff" stroke="#4e9ff5" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="1064" y="400" width="319" height="224" rx="16" fill="#fffaf1" stroke="#ff8b16" stroke-width="2"/>
  <circle cx="88" cy="449" r="25" fill="none" stroke="#168f72" stroke-width="7"/>
  <path d="M70 449h36M88 431v36" stroke="#168f72" stroke-width="7" stroke-linecap="round"/>
  <text x="154" y="463" class="h" fill="#08735f">模型能做的事</text>
  <g class="b">
    <circle cx="74" cy="530" r="8" fill="#23a36f"/><text x="99" y="538">理解当前输入</text>
    <circle cx="74" cy="573" r="8" fill="#23a36f"/><text x="99" y="581">生成文字 / 结构化结果 / Tool Call 请求</text>
    <circle cx="74" cy="616" r="8" fill="#23a36f"/><text x="99" y="624">提出建议，例如“建议调用天气工具”</text>
  </g>
  <path d="M581 438l-22 22 22 22M633 438l22 22-22 22M620 426l-28 68" stroke="#1675c8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="660" y="463" class="h">Python 程序能做的事</text>
  <g class="b">
    <circle cx="584" cy="522" r="8" fill="#2588d8"/><text x="609" y="530">调用真实工具或函数</text>
    <circle cx="584" cy="563" r="8" fill="#2588d8"/><text x="609" y="571">访问数据库 / 文件系统 / 第三方 API</text>
    <circle cx="584" cy="604" r="8" fill="#2588d8"/><text x="609" y="612">执行副作用（发邮件、写文件、更新数据）</text>
    <circle cx="584" cy="645" r="8" fill="#2588d8"/><text x="609" y="653">验证和控制执行边界</text>
  </g>
  <circle cx="1121" cy="451" r="22" fill="#ff951f"/>
  <rect x="1114" y="467" width="14" height="14" rx="4" fill="#ff951f"/>
  <text x="1168" y="463" class="h" fill="#d76100">关键结论</text>
  <rect x="1084" y="493" width="277" height="112" rx="14" fill="#fff7e8" stroke="#ffd19a"/>
  <text x="1110" y="542" class="h" font-size="24">模型有表达能力，</text>
  <text x="1110" y="582" class="h" font-size="24">不等于拥有执行权限。</text>
  <path d="M780 696V732M780 732H514M780 732H780M780 732H1028M514 732V780M780 732V780M1028 732V780" stroke="#2588d8" stroke-width="5" fill="none"/>
  <rect x="389" y="780" width="250" height="122" rx="14" fill="#fbfdff" stroke="#7ca6d0" stroke-width="2"/>
  <rect x="655" y="780" width="250" height="122" rx="14" fill="#fbfdff" stroke="#7ca6d0" stroke-width="2"/>
  <rect x="921" y="780" width="250" height="122" rx="14" fill="#fbfdff" stroke="#7ca6d0" stroke-width="2"/>
  <text x="514" y="830" text-anchor="middle" class="h">数据库</text><text x="514" y="868" text-anchor="middle" class="b">读取 / 写入数据</text>
  <text x="780" y="830" text-anchor="middle" class="h">文件系统</text><text x="780" y="868" text-anchor="middle" class="b">读取 / 写入文件</text>
  <text x="1046" y="830" text-anchor="middle" class="h">第三方 API</text><text x="1046" y="868" text-anchor="middle" class="b">调用外部服务</text>
  <rect x="24" y="937" width="1359" height="92" rx="14" fill="#fff8f8" stroke="#ff9a9a" stroke-width="2"/>
  <polygon points="83,958 111,1011 55,1011" fill="#e53636"/>
  <text x="83" y="997" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">!</text>
  <text x="129" y="995" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#d42f2f">注意：</text>
  <text x="225" y="995" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" fill="#13203b">即使模型说“邮件已经发送”，如果代码没有真正调用邮件系统，就不会有任何邮件被发送。</text>
</svg>